<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Store confirmation sheet placeholder</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
</head>
<body>




<style>
body{margin:0;background:#050b08}
a{color:#86ab95}a:hover{color:#e8fff1}
</style>

<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #050b08; color: #e8fff1; font-family: 'Inter', system-ui, sans-serif;">

  <div aria-hidden="true" style="position: absolute; left: 18px; right: 18px; top: 40px; display: flex; flex-direction: column; gap: 12px; opacity: 0.4;">
    <div style="height: 76px; border-radius: 18px; border: 2px solid #22e07a; background: rgba(34,224,122,0.07);"></div>
    <div style="height: 76px; border-radius: 18px; border: 1px solid #1b3326; background: #0d1812;"></div>
    <div style="height: 76px; border-radius: 18px; border: 1px solid #1b3326; background: #0d1812;"></div>
    <div style="height: 58px; border-radius: 18px; background: #22e07a;"></div>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(2,6,4,0.7);"></div>

  <div style="position: absolute; left: 10px; right: 10px; bottom: 10px; box-sizing: border-box; border-radius: 28px; border: 2px dashed #5c7a69; background: #1a221e; padding: 22px 20px; display: flex; flex-direction: column; gap: 16px;">
    <div style="display: flex; flex-direction: column; gap: 4px;">
      <span style="font-size: 11px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: #b8ff5c;">System sheet, not ours</span>
      <span style="font-size: 13px; line-height: 1.45; color: #c4d3ca;">The App Store or Google Play draws this. We can't change how it looks. It shows what our app sends it:</span>
    </div>
    <div style="border-radius: 16px; background: #232d28; padding: 14px; display: flex; flex-direction: column; gap: 10px; font-size: 14px;">
      <div style="display: flex; justify-content: space-between;"><span style="color: #a9b9b0;">App</span><b style="font-weight: 600;">Lock In</b></div>
      <div style="display: flex; justify-content: space-between;"><span style="color: #a9b9b0;">Plan</span><b style="font-weight: 600;">Yearly</b></div>
      <div style="display: flex; justify-content: space-between;"><span style="color: #a9b9b0;">Free trial</span><b style="font-weight: 600;">7 days</b></div>
      <div style="display: flex; justify-content: space-between;"><span style="color: #a9b9b0;">Then</span><b style="font-weight: 600;">$45 / year</b></div>
    </div>
    <div style="height: 52px; border-radius: 14px; border: 1px solid #5c7a69; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #c4d3ca;">Person confirms with Face ID, fingerprint or password</div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; font-size: 13px;">
      <a href="Locking.dc.html" style="height: 44px; border-radius: 12px; background: #2b3a32; color: #e8fff1; display: flex; align-items: center; justify-content: center; text-decoration: none; font-weight: 600;">Confirmed → screen 3</a>
      <a href="Failed.dc.html" style="height: 44px; border-radius: 12px; background: #2b3a32; color: #e8fff1; display: flex; align-items: center; justify-content: center; text-decoration: none; font-weight: 600;">Closed or failed → 5</a>
    </div>
  </div>
</div>


</body>
</html>
