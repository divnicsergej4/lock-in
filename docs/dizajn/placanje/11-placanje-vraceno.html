<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Purchase restored: welcome back</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
</head>
<body>




<style>
body{margin:0;background:#050b08}
a{color:#86ab95}a:hover{color:#e8fff1}
button{font-family:inherit;cursor:pointer}
</style>

<div style="width: 390px; height: 844px; box-sizing: border-box; background: #050b08; color: #e8fff1; font-family: 'Inter', system-ui, sans-serif; padding: 72px 20px 28px; display: flex; flex-direction: column; gap: 22px;">

  <div style="display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center;">
    <svg width="130" height="130" viewBox="0 0 180 180" role="img" aria-label="Closed padlock with a check mark">
      <circle cx="90" cy="90" r="80" fill="none" stroke="#22e07a" stroke-width="8"/>
      <path d="M68 82 V66 a22 22 0 0 1 44 0 V82" fill="none" stroke="#22e07a" stroke-width="10" stroke-linecap="round"/>
      <rect x="54" y="78" width="72" height="58" rx="16" fill="#22e07a"/>
      <path d="M76 107 l9 9 l19 -20" fill="none" stroke="#04140a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <h1 style="margin: 0; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 38px; font-weight: 800; line-height: 1;">Welcome back.</h1>
      <p style="margin: 0; font-size: 16px; color: #a9c6b5;">We found your plan. Everything is unlocked again.</p>
    </div>
  </div>

  <div style="border-radius: 20px; border: 1px solid #1b3326; background: #0d1812; padding: 6px 16px;">
    <div style="display: flex; justify-content: space-between; align-items: center; height: 50px; border-bottom: 1px solid #1b3326; font-size: 15px;">
      <span style="color: #a9c6b5;">Plan</span><b style="font-weight: 700;">Yearly</b>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: center; height: 50px; font-size: 15px;">
      <span style="color: #a9c6b5;">Renews</span><b style="font-weight: 700;">Mar 12, 2027</b>
    </div>
  </div>

  <div style="border-radius: 20px; border: 1px solid #1b3326; background: #0d1812; padding: 16px; display: flex; gap: 12px; align-items: flex-start;">
    <span style="width: 36px; height: 36px; flex: none; border-radius: 11px; background: rgba(34,224,122,0.10); color: #22e07a; display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/></svg></span>
    <div style="display: flex; flex-direction: column; gap: 4px;">
      <b style="font-size: 15px; font-weight: 700;">New phone?</b>
      <span style="font-size: 14px; line-height: 1.45; color: #a9c6b5;">Your spending lives on the old phone, not on our servers. Bring it over with More → Backup → Import.</span>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px; margin-top: auto;">
    <button type="button" style="height: 58px; border-radius: 18px; border: none; background: #22e07a; color: #04140a; font-size: 18px; font-weight: 800;">Continue</button>
    <button type="button" style="height: 44px; border: none; background: none; color: #e8fff1; font-size: 15px; font-weight: 600;">Import a backup</button>
  </div>
</div>


</body>
</html>
