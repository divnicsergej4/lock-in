<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Trial started: you're locked in</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
</head>
<body>




<style>
body{margin:0;background:#050b08}
a{color:#86ab95}a:hover{color:#e8fff1}
button{font-family:inherit;cursor:pointer}
</style>

<div style="width: 390px; height: 844px; box-sizing: border-box; background: #050b08; color: #e8fff1; font-family: 'Inter', system-ui, sans-serif; padding: 56px 20px 28px; display: flex; flex-direction: column; gap: 22px;">

  <div style="display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center;">
    <svg width="150" height="150" viewBox="0 0 180 180" role="img" aria-label="Closed padlock inside a full green ring">
      <circle cx="90" cy="90" r="80" fill="none" stroke="#22e07a" stroke-width="8"/>
      <circle cx="90" cy="90" r="64" fill="rgba(34,224,122,0.08)"/>
      <path d="M68 82 V66 a22 22 0 0 1 44 0 V82" fill="none" stroke="#22e07a" stroke-width="10" stroke-linecap="round"/>
      <rect x="54" y="78" width="72" height="58" rx="16" fill="#22e07a"/>
      <circle cx="90" cy="102" r="7" fill="#04140a"/>
      <rect x="86.5" y="105" width="7" height="16" rx="3.5" fill="#04140a"/>
    </svg>
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <h1 style="margin: 0; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 40px; font-weight: 800; line-height: 1; letter-spacing: -0.015em;">You're locked in.</h1>
      <p style="margin: 0; font-size: 16px; color: #a9c6b5;">Your free week starts now. Everything is unlocked.</p>
    </div>
  </div>

  <div style="border-radius: 20px; border: 1px solid #1b3326; background: #0d1812; padding: 6px 16px;">
    <div style="display: flex; justify-content: space-between; align-items: center; height: 50px; border-bottom: 1px solid #1b3326; font-size: 15px;">
      <span style="color: #a9c6b5;">Free until</span><b style="font-weight: 700;">Nov 5</b>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: center; height: 50px; border-bottom: 1px solid #1b3326; font-size: 15px;">
      <span style="color: #a9c6b5;">Then</span><b style="font-weight: 700;">$45 a year</b>
    </div>
    <label style="display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 62px; font-size: 15px; cursor: pointer;">
      <span style="display: flex; flex-direction: column; gap: 2px;">
        <b style="font-weight: 600;">Remind me on Nov 3</b>
        <span style="font-size: 12px; color: #86ab95;">So you're never charged by surprise</span>
      </span>
      <span style="position: relative; width: 52px; height: 32px; flex: none;">
        <input type="checkbox" role="switch" checked style="position: absolute; inset: 0; width: 52px; height: 32px; margin: 0; opacity: 0; cursor: pointer;">
        <span aria-hidden="true" style="position: absolute; inset: 0; border-radius: 16px; background: #22e07a;"></span>
        <span aria-hidden="true" style="position: absolute; top: 3px; left: 23px; width: 26px; height: 26px; border-radius: 50%; background: #04140a;"></span>
      </span>
    </label>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px; margin-top: auto;">
    <button type="button" style="height: 58px; border-radius: 18px; border: none; background: #22e07a; color: #04140a; font-size: 18px; font-weight: 800;">Show me around</button>
    <button type="button" style="height: 44px; border: none; background: none; color: #e8fff1; font-size: 15px; font-weight: 600;">Skip the tour</button>
    <div style="font-size: 12px; color: #86ab95; text-align: center;">Cancel anytime in Settings → Subscription.</div>
  </div>
</div>


</body>
</html>
