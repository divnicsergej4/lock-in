<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Locking you in: processing</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
</head>
<body>




<style>
body{margin:0;background:#050b08}
</style>

<div style="width: 390px; height: 844px; box-sizing: border-box; background: #050b08; color: #e8fff1; font-family: 'Inter', system-ui, sans-serif; padding: 0 28px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; text-align: center;">

  <svg width="180" height="180" viewBox="0 0 180 180" role="img" aria-label="Padlock closing while the payment is checked">
    <circle cx="90" cy="90" r="80" fill="none" stroke="#1b3326" stroke-width="8"/>
    <circle cx="90" cy="90" r="80" fill="none" stroke="#22e07a" stroke-width="8" stroke-linecap="round" stroke-dasharray="320 502.7" transform="rotate(-90 90 90)"/>
    <path d="M68 74 V58 a22 22 0 0 1 44 0 V66" fill="none" stroke="#22e07a" stroke-width="10" stroke-linecap="round"/>
    <rect x="54" y="78" width="72" height="58" rx="16" fill="#22e07a"/>
    <circle cx="90" cy="102" r="7" fill="#04140a"/>
    <rect x="86.5" y="105" width="7" height="16" rx="3.5" fill="#04140a"/>
  </svg>

  <div style="display: flex; flex-direction: column; gap: 8px;">
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 34px; font-weight: 800; line-height: 1.05;">Locking you in…</h1>
    <p style="margin: 0; font-size: 15px; color: #a9c6b5; line-height: 1.45;">Checking with the App Store. Keep the app open for a few seconds.</p>
  </div>

  <div style="width: 100%; max-width: 280px; display: flex; flex-direction: column; gap: 12px; text-align: left;">
    <div style="display: flex; align-items: center; gap: 12px; font-size: 15px;">
      <span style="width: 24px; height: 24px; flex: none; border-radius: 50%; background: #22e07a; color: #04140a; display: flex; align-items: center; justify-content: center;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
      Payment confirmed
    </div>
    <div style="display: flex; align-items: center; gap: 12px; font-size: 15px;">
      <span style="width: 24px; height: 24px; flex: none; border-radius: 50%; border: 2px solid #22e07a; box-sizing: border-box; display: flex; align-items: center; justify-content: center;"><span style="width: 8px; height: 8px; border-radius: 50%; background: #22e07a;"></span></span>
      Unlocking everything
    </div>
    <div style="display: flex; align-items: center; gap: 12px; font-size: 15px; color: #86ab95;">
      <span style="width: 24px; height: 24px; flex: none; border-radius: 50%; border: 2px solid #2c4a39; box-sizing: border-box;"></span>
      Saving your plan
    </div>
  </div>
</div>


</body>
</html>
