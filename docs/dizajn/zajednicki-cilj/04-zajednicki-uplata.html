<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Put money in a shared goal</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
</head>
<body>




<style>
body{margin:0;background:#050b08}
a{color:#f5c84b}a:hover{color:#ffe08a}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit}
</style>

<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #050b08; color: #e8fff1; font-family: 'Inter', system-ui, sans-serif;">

  <div aria-hidden="true" style="position: absolute; left: 16px; right: 16px; top: 72px; display: flex; flex-direction: column; gap: 14px; opacity: 0.35;">
    <div style="font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 30px; font-weight: 800;">Summer trip to Greece</div>
    <div style="height: 260px; border-radius: 24px; border: 1px solid #5a4a16; background: linear-gradient(160deg, #2a2209, #0d1812 70%);"></div>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(2,6,4,0.72);"></div>

  <div role="dialog" aria-label="Put money in" style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; border-radius: 28px 28px 0 0; border-top: 1px solid #5a4a16; background: #0d1812; padding: 10px 18px 28px; display: flex; flex-direction: column; gap: 16px;">
    <div style="width: 40px; height: 5px; border-radius: 3px; background: #2c4a39; align-self: center;"></div>

    <div style="display: flex; justify-content: space-between; align-items: flex-start;">
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <h2 style="margin: 0; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 24px; font-weight: 800;">Put money in</h2>
        <div style="font-size: 14px; color: #c9b77a;">Summer trip to Greece</div>
      </div>
      <button type="button" aria-label="Close" style="width: 40px; height: 40px; border-radius: 12px; border: 1px solid #1b3326; background: none; color: #86ab95; display: flex; align-items: center; justify-content: center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px; align-items: center;">
      <label for="amt" style="font-size: 12px; font-weight: 600; color: #86ab95;">Amount</label>
      <div style="width: 100%; box-sizing: border-box; border: 1.5px solid #f5c84b; border-radius: 18px; background: rgba(245,200,75,0.06); height: 76px; display: flex; align-items: center; justify-content: center; gap: 6px;">
        <input id="amt" type="text" inputmode="decimal" value="50" style="width: 110px; border: none; background: none; color: #e8fff1; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 44px; font-weight: 800; text-align: right; outline: none; font-variant-numeric: tabular-nums;">
        <span style="font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 30px; font-weight: 700; color: #c9b77a;">€</span>
      </div>
    </div>

    <div style="display: flex; gap: 8px; flex-wrap: wrap;">
      <button type="button" style="height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #1b3326; background: #0a140f; color: #e8fff1; font-size: 14px; font-weight: 600;">+10</button>
      <button type="button" style="height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #1b3326; background: #0a140f; color: #e8fff1; font-size: 14px; font-weight: 600;">+20</button>
      <button type="button" style="height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #1b3326; background: #0a140f; color: #e8fff1; font-size: 14px; font-weight: 600;">+50</button>
      <button type="button" style="height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #5a4a16; background: rgba(245,200,75,0.10); color: #f5c84b; font-size: 14px; font-weight: 700;">Rest of my share · 147</button>
    </div>

    <div style="border-radius: 18px; background: #0a140f; border: 1px solid #1b3326; padding: 14px; display: flex; flex-direction: column; gap: 10px;">
      <div style="display: flex; justify-content: space-between; font-size: 13px;">
        <span style="color: #86ab95;">After this</span>
        <b style="font-weight: 700; font-variant-numeric: tabular-nums;">1,290 / 2,000 € · 65%</b>
      </div>
      <div style="height: 10px; border-radius: 5px; background: #1b3326; overflow: hidden; display: flex;">
        <div style="width: 28.5%; height: 10px; background: #22e07a;"></div>
        <div style="width: 20%; height: 10px; background: #5aa9f0;"></div>
        <div style="width: 16%; height: 10px; background: #ff7eb6;"></div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #c9d8cf;">
        <div style="display: flex; align-items: center; gap: 8px;">
          <span style="width: 8px; height: 8px; flex: none; border-radius: 50%; background: #f5c84b;"></span>
          Next pin at 75%: 210 € away
        </div>
        <div style="display: flex; align-items: center; gap: 8px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="#ff9a3d" aria-hidden="true"><path d="M12 2c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5 0 2 1 3 2 3 0-3-1-6 1-9.5z"/></svg>
          Counts for this week's squad streak
        </div>
      </div>
    </div>

    <button type="button" style="height: 56px; border-radius: 16px; border: none; background: #f5c84b; color: #1a1000; font-size: 17px; font-weight: 700;">Put in 50 €</button>
    <div style="font-size: 12px; color: #86ab95; text-align: center; margin-top: -6px;">Only you can change or delete your own entries.</div>
  </div>
</div>


</body>
</html>
