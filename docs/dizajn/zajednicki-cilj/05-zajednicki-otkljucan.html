<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shared goal reached: unlocked</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
</head>
<body>




<style>
body{margin:0;background:#050b08}
a{color:#f5c84b}a:hover{color:#ffe08a}
button{font-family:inherit;cursor:pointer}
</style>

<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #050b08; color: #e8fff1; font-family: 'Inter', system-ui, sans-serif; padding: 12px 16px 28px; display: flex; flex-direction: column; gap: 14px;">

  <div style="display: flex; align-items: center; justify-content: space-between; height: 48px;">
    <button type="button" aria-label="Back to Savings" style="display: flex; align-items: center; gap: 4px; height: 44px; padding: 0 10px 0 4px; border: none; background: none; color: #86ab95; font-size: 15px; font-weight: 500;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      Savings
    </button>
  </div>

  <div style="display: flex; justify-content: center; margin-top: -8px;">
    <svg width="270" height="270" viewBox="0 0 280 280" role="img" aria-label="The padlock is open and the ring is full">
      <defs>
        <radialGradient id="glow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#f5c84b" stop-opacity="0.32"/>
          <stop offset="100%" stop-color="#f5c84b" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <circle cx="140" cy="140" r="112" fill="url(#glow)"/>
      <g transform="rotate(-90 140 140)">
        <circle cx="140" cy="140" r="124" fill="none" stroke="#22e07a" stroke-width="14" stroke-dasharray="293.1 779.1" stroke-dashoffset="-1.5"/>
        <circle cx="140" cy="140" r="124" fill="none" stroke="#5aa9f0" stroke-width="14" stroke-dasharray="261.9 779.1" stroke-dashoffset="-297.6"/>
        <circle cx="140" cy="140" r="124" fill="none" stroke="#ff7eb6" stroke-width="14" stroke-dasharray="215.1 779.1" stroke-dashoffset="-562.5"/>
      </g>
      <circle cx="264" cy="140" r="6" fill="#f5c84b" stroke="#141106" stroke-width="3"/>
      <circle cx="140" cy="264" r="6" fill="#f5c84b" stroke="#141106" stroke-width="3"/>
      <circle cx="16" cy="140" r="6" fill="#f5c84b" stroke="#141106" stroke-width="3"/>
      <circle cx="140" cy="16" r="8" fill="#f5c84b" stroke="#141106" stroke-width="3"/>
      <path d="M113 128 V80 a27 27 0 0 1 54 0 V94" fill="none" stroke="#f5c84b" stroke-width="13" stroke-linecap="round"/>
      <rect x="92" y="122" width="96" height="80" rx="20" fill="#f5c84b"/>
      <rect x="92" y="122" width="96" height="12" rx="6" fill="#ffe08a" opacity="0.55"/>
      <circle cx="140" cy="156" r="9" fill="#2a2209"/>
      <rect x="135.5" y="160" width="9" height="22" rx="4.5" fill="#2a2209"/>
      <rect x="54" y="70" width="8" height="4" rx="2" fill="#22e07a" transform="rotate(-30 58 72)"/>
      <rect x="214" y="78" width="8" height="4" rx="2" fill="#ff7eb6" transform="rotate(25 218 80)"/>
      <rect x="62" y="206" width="8" height="4" rx="2" fill="#5aa9f0" transform="rotate(40 66 208)"/>
      <rect x="206" y="200" width="8" height="4" rx="2" fill="#f5c84b" transform="rotate(-45 210 202)"/>
      <circle cx="200" cy="52" r="2.5" fill="#f5c84b"/>
      <circle cx="82" cy="46" r="2.5" fill="#5aa9f0"/>
      <circle cx="232" cy="150" r="2" fill="#22e07a"/>
      <circle cx="44" cy="150" r="2" fill="#ff7eb6"/>
    </svg>
  </div>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; margin-top: -6px;">
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 52px; font-weight: 800; line-height: 1; color: #f5c84b; letter-spacing: -0.02em;">Unlocked.</h1>
    <div style="font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 22px; font-weight: 700;">Summer trip to Greece</div>
    <div style="font-size: 14px; color: #c9b77a;">2,000 € · 3 people · 6 months</div>
    <p style="margin: 4px 0 0; font-size: 15px; color: #c9d8cf;">Now book it before anyone spends it.</p>
  </div>

  <div style="border-radius: 20px; border: 1px solid #5a4a16; background: linear-gradient(160deg, #2a2209, #0d1812 70%); padding: 14px; display: flex; flex-direction: column; gap: 10px;">
    <div style="height: 10px; border-radius: 5px; overflow: hidden; display: flex; gap: 2px;">
      <div style="width: 38%; height: 10px; background: #22e07a;"></div>
      <div style="width: 34%; height: 10px; background: #5aa9f0;"></div>
      <div style="width: 28%; height: 10px; background: #ff7eb6;"></div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <span style="font-size: 12px; color: #86ab95; display: flex; align-items: center; gap: 6px;"><span style="width: 8px; height: 8px; border-radius: 50%; background: #22e07a;"></span>You</span>
        <b style="font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums;">760 €</b>
      </div>
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <span style="font-size: 12px; color: #86ab95; display: flex; align-items: center; gap: 6px;"><span style="width: 8px; height: 8px; border-radius: 50%; background: #5aa9f0;"></span>Marko</span>
        <b style="font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums;">680 €</b>
      </div>
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <span style="font-size: 12px; color: #86ab95; display: flex; align-items: center; gap: 6px;"><span style="width: 8px; height: 8px; border-radius: 50%; background: #ff7eb6;"></span>Ana</span>
        <b style="font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums;">560 €</b>
      </div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px; margin-top: auto;">
    <button type="button" style="height: 54px; border-radius: 16px; border: none; background: #f5c84b; color: #1a1000; font-size: 17px; font-weight: 700;">Set a new target</button>
    <button type="button" style="height: 48px; border-radius: 16px; border: 1px solid #1b3326; background: none; color: #e8fff1; font-size: 15px; font-weight: 600;">Keep it as it is</button>
  </div>
</div>


</body>
</html>
