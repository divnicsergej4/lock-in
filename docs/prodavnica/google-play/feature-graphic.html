<!doctype html>
<!-- Google Play feature graphic (1024×500). Rendered to feature-graphic.png with headless Edge:
     msedge --headless=new --disable-gpu --hide-scrollbars --window-size=1024,500 --screenshot=<png> <this file> -->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: Brico; font-weight: 800; src: url('../../../mobile/node_modules/@expo-google-fonts/bricolage-grotesque/800ExtraBold/BricolageGrotesque_800ExtraBold.ttf'); }
  @font-face { font-family: Brico; font-weight: 600; src: url('../../../mobile/node_modules/@expo-google-fonts/bricolage-grotesque/600SemiBold/BricolageGrotesque_600SemiBold.ttf'); }
  @font-face { font-family: Inter; font-weight: 500; src: url('../../../mobile/node_modules/@expo-google-fonts/inter/500Medium/Inter_500Medium.ttf'); }
  @font-face { font-family: Inter; font-weight: 700; src: url('../../../mobile/node_modules/@expo-google-fonts/inter/700Bold/Inter_700Bold.ttf'); }
  html, body { margin: 0; width: 1024px; height: 500px; overflow: hidden; }
  body {
    position: relative;
    background:
      radial-gradient(520px 360px at 78% 55%, rgba(34, 224, 122, 0.20), transparent 70%),
      radial-gradient(420px 300px at 10% 0%, rgba(34, 224, 122, 0.10), transparent 70%),
      #060c08;
    font-family: Inter, sans-serif;
    color: #eafff2;
  }
  .left { position: absolute; left: 64px; top: 0; bottom: 0; width: 470px; display: flex; flex-direction: column; justify-content: center; }
  .brand { display: flex; align-items: center; gap: 18px; }
  .brand img { width: 84px; height: 84px; border-radius: 20px; box-shadow: 0 0 0 1px rgba(120, 255, 190, 0.18); }
  .brand span { font-family: Brico; font-weight: 800; font-size: 64px; letter-spacing: -1.6px; color: #22e07a; }
  h1 { margin: 26px 0 0; font-family: Brico; font-weight: 800; font-size: 40px; line-height: 1.08; letter-spacing: -0.8px; color: #fff; }
  p { margin: 16px 0 0; font-size: 20px; line-height: 1.4; color: #9fbfae; }
  .right { position: absolute; right: 64px; top: 0; bottom: 0; width: 380px; display: flex; flex-direction: column; justify-content: center; gap: 14px; }
  .card { background: #fff; border-radius: 22px; padding: 18px 20px; display: flex; align-items: center; gap: 14px; box-shadow: 0 22px 48px -20px rgba(0, 0, 0, 0.6); }
  .ico { width: 44px; height: 44px; border-radius: 12px; background: #e7f1fd; border: 1px solid #c9def6; display: flex; align-items: center; justify-content: center; }
  .card .t { flex: 1; }
  .card b { display: block; font-family: Brico; font-weight: 800; font-size: 21px; color: #0d1f15; }
  .card small { font-family: Brico; font-weight: 600; font-size: 15px; color: #6d7d73; }
  .card .amt { font-family: Brico; font-weight: 800; font-size: 22px; color: #d93a3a; }
  .roast { margin: 0 8px; background: #0f1a14; border: 1px solid rgba(120, 255, 190, 0.14); border-radius: 18px; padding: 18px 20px; display: flex; gap: 14px; align-items: center; box-shadow: 0 22px 44px -16px rgba(0, 0, 0, 0.7); }
  .roast img { width: 38px; height: 38px; border-radius: 10px; }
  .roast span { font-family: Brico; font-weight: 600; font-size: 20px; line-height: 1.3; color: #fff; }
  .levels { margin: 4px 34px 0; display: flex; padding: 4px; border-radius: 16px; background: rgba(255, 255, 255, 0.07); }
  .levels div { flex: 1; text-align: center; padding: 8px 0; font-family: Brico; font-weight: 600; font-size: 15px; color: #7d9688; border-radius: 12px; }
  .levels .on { background: #fff; color: #d93a3a; }
</style>
</head>
<body>
  <div class="left">
    <div class="brand"><img src="../../../mobile/assets/icon.png" alt=""><span>Lock In</span></div>
    <h1>The money tracker that calls you out.</h1>
    <p>Log what you spend, keep your streak and save with friends. No bank login.</p>
  </div>
  <div class="right">
    <div class="card">
      <div class="ico">
        <!-- Food: the app's fork and knife line icon -->
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#5aa9f0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v7a2 2 0 0 0 4 0V3M8 3v18M17 21V3c-2 1.5-3 4-3 7v3h3"/></svg>
      </div>
      <div class="t"><b>Food</b><small>dinner delivery</small></div>
      <div class="amt">−$38</div>
    </div>
    <div class="roast"><img src="../../../mobile/assets/icon.png" alt=""><span>food is a need, but that price was a choice bro...</span></div>
    <div class="levels"><div>Gentle</div><div>Normal</div><div class="on">No mercy</div></div>
  </div>
</body>
</html>
